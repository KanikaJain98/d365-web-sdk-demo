<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D365 Marketing Web SDK Integration</title>
    
    <!-- Load the D365 Web SDK -->
    <script type="text/javascript">
        (function(w,d,s,r,o){
            w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments); };
            var a = d.createElement(s), m = d.getElementsByTagName(s)[0];
            a.async = true; a.src = r; m.parentNode.insertBefore(a, m);
        })(window, document, 'script', 'https://microchip-uat.crm.dynamics.com/websdk.js', 'msdynmkt');

        // Initialize the SDK with your organization details
        msdynmkt('config', {
            organizationId: 'b7fb7730-768f-ef11-8a66-002248282c3b',  // Replace with your Org ID
            environmentId: '423d3764-171f-e70d-a2f9-f00eba87a316'    // Replace with your Environment ID
        });
    </script>

    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #0078D4; }
        button { background-color: #0078D4; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 18px; }
        button:hover { background-color: #005A9E; }
    </style>
</head>

<body>
    <h1>Welcome to My D365 Web SDK Demo</h1>
    <p>Click the button below to simulate an event and trigger a marketing journey.</p>

    <button onclick="trackEvent()">Track Event</button>

    <script>
        function trackEvent() {
            msdynmkt('trackEvent', {
                eventName: 'ButtonClicked',
                contactId: 'CONTACT_GUID',  // Replace with actual contact ID
                data: {
                    eventType: 'CTA Click',
                    buttonName: 'Track Event Button'
                }
            });

            alert("Event Tracked! Check D365 Marketing for insights.");
        }
    </script>
</body>
</html>
